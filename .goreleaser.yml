# GoReleaser configuration for git-scope
# Run: goreleaser release --clean

project_name: git-scope

builds:
  - id: git-scope
    main: ./cmd/git-scope
    binary: git-scope
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

# SPDX SBOM per archive (needs syft on PATH; the release workflow installs it)
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Casks replace the deprecated `brews` formula. One-time tap migration, done in
# Bharath-code/homebrew-tap after the first cask release: add
# tap_migrations.json with {"git-scope": "git-scope"} and delete Formula/git-scope.rb.
homebrew_casks:
  - name: git-scope
    repository:
      owner: Bharath-code
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Bharath-code/git-scope"
    description: "Repo-state layer for AI coding agents: see uncommitted and unpushed work across every git repo"
    license: "MIT"
    # Binaries are not notarized; drop the quarantine flag so macOS will run them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/git-scope"]
          end
